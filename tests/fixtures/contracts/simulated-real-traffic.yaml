# Draft contract for simulated-real-traffic-01, proposed by the ingestion job from its header.
# Check every mapping and replace each TODO, then save this file as
# contracts/simulated-real-traffic.yaml and open a pull request with a sample of the file.
# Not found in the file: src_ip, dst_ip, label.
name: simulated-real-traffic
version: 1
timestamp_format: '%Y-%m-%d %H:%M:%S'
fields:
