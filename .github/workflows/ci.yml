name: CI

# Every pull request must pass these four jobs before it can merge (OPS-02).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: actionlint
      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          scripts=(scripts/**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then echo "no shell scripts"; else shellcheck "${scripts[@]}"; fi

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install -e .
      - run: pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=80

  cfn-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: cfn-lint
        run: |
          shopt -s nullglob
          templates=(infra/*.yaml)
          if [ ${#templates[@]} -eq 0 ]; then echo "no templates"; else cfn-lint "${templates[@]}"; fi

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t cicnids:ci .
      # Trivy runs from its pinned official image; the DB comes from the ECR Public mirror,
      # which avoids ghcr.io rate limits
      - name: Trivy scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1
          image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress
          --db-repository public.ecr.aws/aquasecurity/trivy-db:2 cicnids:ci
