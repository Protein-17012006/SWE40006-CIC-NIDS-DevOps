# Streamlit 1.66.1's bundled material-ui theme (.agents/skills/developing-with-streamlit/
# assets/templates/themes/configs/material-ui.toml), unchanged except chartCategoricalColors

# Material UI Theme for Streamlit
# Google's Material Design 3 aesthetic
# Clean, accessible, systematic design language

[theme]
base = "light"
primaryColor = "#6750A4"
backgroundColor = "#FFFBFE"
secondaryBackgroundColor = "#F7F2FA"
codeBackgroundColor = "#E8DEF8"
textColor = "#1C1B1F"
linkColor = "#6750A4"
borderColor = "#CAC4D0"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "16px"
buttonRadius = "full"
font = "'Roboto':https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
codeFont = "'Roboto Mono':https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
codeFontSize = "14px"
codeTextColor = "#1C1B1F"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["36px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [400, 400, 500, 500, 500, 500]
linkUnderline = false
# Category colours of app/data/fields.py, in ATTACK_CATEGORIES order (UI-09)
chartCategoricalColors = ["#8F8D86", "#2A78D6", "#EB6834", "#1BAF7A", "#EDA100", "#E87BA4", "#008300"]

# Material Design 3 colors
violetColor = "#6750A4"
redColor = "#B3261E"
greenColor = "#386A20"
blueColor = "#006874"
orangeColor = "#924C25"
yellowColor = "#7C5800"

dataframeBorderColor = "#CAC4D0"
dataframeHeaderBackgroundColor = "#E8DEF8"

[theme.sidebar]
backgroundColor = "#F7F2FA"
secondaryBackgroundColor = "#E8DEF8"
codeBackgroundColor = "#D0BCFF"
borderColor = "#CAC4D0"

[browser]
gatherUsageStats = false

[client]
# Hide the developer menu and the Deploy button from dashboard users
toolbarMode = "minimal"
