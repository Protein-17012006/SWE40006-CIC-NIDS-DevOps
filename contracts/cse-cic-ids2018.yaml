# CSE-CIC-IDS2018, "Processed Traffic Data for ML Algorithms": ten day files from CICFlowMeter.
# Nine have 80 columns; the 20 February file adds Flow ID, Src IP, Src Port and Dst IP.
name: cse-cic-ids2018
version: 1
timestamp_format: "%d/%m/%Y %H:%M:%S"

# canonical field: source column
fields:
  timestamp: Timestamp
  dst_port: Dst Port
  protocol: Protocol
  flow_duration_us: Flow Duration
  fwd_packets: Tot Fwd Pkts
  bwd_packets: Tot Bwd Pkts
  fwd_bytes: TotLen Fwd Pkts
  bwd_bytes: TotLen Bwd Pkts
  flow_bytes_per_s: Flow Byts/s
  flow_packets_per_s: Flow Pkts/s
  src_ip: Src IP
  dst_ip: Dst IP
  label: Label

# Kept as extras, not flagged as new columns
known_extras:
  - Flow ID
  - Src Port
  - Fwd Pkt Len Max
  - Fwd Pkt Len Min
  - Fwd Pkt Len Mean
  - Fwd Pkt Len Std
  - Bwd Pkt Len Max
  - Bwd Pkt Len Min
  - Bwd Pkt Len Mean
  - Bwd Pkt Len Std
  - Flow IAT Mean
  - Flow IAT Std
  - Flow IAT Max
  - Flow IAT Min
  - Fwd IAT Tot
  - Fwd IAT Mean
  - Fwd IAT Std
  - Fwd IAT Max
  - Fwd IAT Min
  - Bwd IAT Tot
  - Bwd IAT Mean
  - Bwd IAT Std
  - Bwd IAT Max
  - Bwd IAT Min
  - Fwd PSH Flags
  - Bwd PSH Flags
  - Fwd URG Flags
  - Bwd URG Flags
  - Fwd Header Len
  - Bwd Header Len
  - Fwd Pkts/s
  - Bwd Pkts/s
  - Pkt Len Min
  - Pkt Len Max
  - Pkt Len Mean
  - Pkt Len Std
  - Pkt Len Var
  - FIN Flag Cnt
  - SYN Flag Cnt
  - RST Flag Cnt
  - PSH Flag Cnt
  - ACK Flag Cnt
  - URG Flag Cnt
  - CWE Flag Count
  - ECE Flag Cnt
  - Down/Up Ratio
  - Pkt Size Avg
  - Fwd Seg Size Avg
  - Bwd Seg Size Avg
  - Fwd Byts/b Avg
  - Fwd Pkts/b Avg
  - Fwd Blk Rate Avg
  - Bwd Byts/b Avg
  - Bwd Pkts/b Avg
  - Bwd Blk Rate Avg
  - Subflow Fwd Pkts
  - Subflow Fwd Byts
  - Subflow Bwd Pkts
  - Subflow Bwd Byts
  - Init Fwd Win Byts
  - Init Bwd Win Byts
  - Fwd Act Data Pkts
  - Fwd Seg Size Min
  - Active Mean
  - Active Std
  - Active Max
  - Active Min
  - Idle Mean
  - Idle Std
  - Idle Max
  - Idle Min

# label as written in the files: attack category ("Infilteration" is the dataset's spelling)
label_map:
  Benign: Benign
  Bot: Botnet
  Brute Force -Web: Web attack
  Brute Force -XSS: Web attack
  SQL Injection: Web attack
  DDOS attack-HOIC: DDoS
  DDOS attack-LOIC-UDP: DDoS
  DDoS attacks-LOIC-HTTP: DDoS
  DoS attacks-GoldenEye: DoS
  DoS attacks-Hulk: DoS
  DoS attacks-SlowHTTPTest: DoS
  DoS attacks-Slowloris: DoS
  FTP-BruteForce: Brute force
  SSH-Bruteforce: Brute force
  Infilteration: Infiltration
