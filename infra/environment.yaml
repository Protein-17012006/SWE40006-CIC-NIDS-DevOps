AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One CIC-NIDS environment: its bucket, secrets, roles, logs, load balancer listener, task
  definitions and ECS service. deploy.yml updates it on every release, first with the new
  JobImageTag (for migrations) and then with the new AppImageTag.

Parameters:
  EnvName:
    Type: String
    AllowedValues: [development, test, staging, production]
  ListenerPort:
    Type: Number
    Description: The load balancer port this environment answers on
  DbTier:
    Type: String
    AllowedValues: [Prod, Nonprod]
    Description: Which RDS instance holds this environment's database
  ClusterName:
    Type: String
  AppCpu:
    Type: String
    AllowedValues: ["256", "512"]
  AppMemory:
    Type: String
    Default: "1024"
  AppImageTag:
    Type: String
    Description: Image tag the dashboard service runs (a 7-character commit hash)
  JobImageTag:
    Type: String
    Description: Image tag the one-off job and admin tasks run
  DesiredCount:
    Type: Number
    Default: 1
  PlatformStack:
    Type: String
    Default: cicnids-platform
  DatabasesStack:
    Type: String
    Default: cicnids-databases

Resources:
  # raw/ for uploads (never edited), processed/ for Parquet, quarantine/ for reports
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cicnids-${EnvName}-${AWS::AccountId}
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /cicnids/${EnvName}
      RetentionInDays: 14

  # Secret names end with the stack's id: Secrets Manager keeps a deleted name for at least
  # 7 days, which would block deleting and recreating this stack (OPS-01).
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub
        - cicnids/${EnvName}/db-${StackUuid}
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      Description: !Sub Database role and connection details for ${EnvName}
      GenerateSecretString:
        SecretStringTemplate: !Sub
          - '{"username": "cicnids_${EnvName}", "dbname": "cicnids_${EnvName}", "host": "${Host}", "port": ${Port}}'
          - Host:
              Fn::ImportValue: !Sub ${DatabasesStack}-${DbTier}Endpoint
            Port:
              Fn::ImportValue: !Sub ${DatabasesStack}-${DbTier}Port
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  UploadPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub
        - cicnids/${EnvName}/upload-password-${StackUuid}
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      Description: !Sub Shared password for the upload card in ${EnvName}
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub CIC-NIDS ${EnvName} tasks; only the load balancer reaches the app
      VpcId:
        Fn::ImportValue: !Sub ${PlatformStack}-VpcId
      SecurityGroupIngress:
        - Description: load balancer
          IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub ${PlatformStack}-AlbSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub cicnids-${EnvName}-tasks

  DbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: !Sub CIC-NIDS ${EnvName} tasks
      GroupId:
        Fn::ImportValue: !Sub ${DatabasesStack}-${DbTier}SecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub ${PlatformStack}-VpcId
      Protocol: HTTP
      Port: 8501
      TargetType: ip
      HealthCheckPath: /_stcore/health
      Matcher:
        HttpCode: "200"
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Fn::ImportValue: !Sub ${PlatformStack}-AlbArn
      Port: !Ref ListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cicnids-${EnvName}-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-environment-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecret
                  - !Ref UploadPasswordSecret

  # Only the admin task (db-bootstrap) may read the RDS master secret.
  AdminExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cicnids-${EnvName}-admin-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-database-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecret
                  - Fn::ImportValue: !Sub ${DatabasesStack}-${DbTier}MasterSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cicnids-${EnvName}-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: own-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${Bucket.Arn}/*
              # A re-ingested file replaces its Parquet parts; raw/ is never deleted
              - Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub ${Bucket.Arn}/processed/*

  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub cicnids-${EnvName}-app
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref AppCpu
      Memory: !Ref AppMemory
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub
            - ${Repository}:${AppImageTag}
            - Repository:
                Fn::ImportValue: !Sub ${PlatformStack}-EcrRepositoryUri
          Essential: true
          PortMappings:
            - ContainerPort: 8501
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: !Ref EnvName
            - Name: APP_VERSION
              Value: !Ref AppImageTag
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref Bucket
          Secrets:
            - Name: DB_SECRET
              ValueFrom: !Ref DbSecret
            - Name: UPLOAD_PASSWORD
              ValueFrom: !Ref UploadPasswordSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  # Ingestion, migrations and the end-to-end tests; the command is overridden per run.
  JobTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub cicnids-${EnvName}-job
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "2048"
      Memory: "8192"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: job
          Image: !Sub
            - ${Repository}:${JobImageTag}
            - Repository:
                Fn::ImportValue: !Sub ${PlatformStack}-EcrRepositoryUri
          Essential: true
          Command: [python, -m, pipeline, --help]
          Environment:
            - Name: APP_ENV
              Value: !Ref EnvName
            - Name: APP_VERSION
              Value: !Ref JobImageTag
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref Bucket
          Secrets:
            - Name: DB_SECRET
              ValueFrom: !Ref DbSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: job

  AdminTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub cicnids-${EnvName}-admin
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt AdminExecutionRole.Arn
      ContainerDefinitions:
        - Name: admin
          Image: !Sub
            - ${Repository}:${JobImageTag}
            - Repository:
                Fn::ImportValue: !Sub ${PlatformStack}-EcrRepositoryUri
          Essential: true
          Command: [python, -m, pipeline, db-bootstrap]
          Environment:
            - Name: APP_ENV
              Value: !Ref EnvName
            - Name: APP_VERSION
              Value: !Ref JobImageTag
          Secrets:
            - Name: DB_SECRET
              ValueFrom: !Ref DbSecret
            - Name: DB_MASTER_SECRET
              ValueFrom:
                Fn::ImportValue: !Sub ${DatabasesStack}-${DbTier}MasterSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: admin

  # Rolling replacement: new tasks pass the health check before old ones stop (NFR-02).
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub cicnids-${EnvName}
      Cluster: !Ref ClusterName
      LaunchType: FARGATE
      PlatformVersion: LATEST
      TaskDefinition: !Ref AppTaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub ${PlatformStack}-PublicSubnetIds
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8501
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  # EventBridge starts the job task for every file that lands in raw/ (ING-01).
  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cicnids-${EnvName}-events
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-ingestion-job
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/cicnids-${EnvName}-job:*
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

  IngestRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cicnids-${EnvName}-ingest
      Description: !Sub Ingest each CSV file uploaded to raw/ in the ${EnvName} bucket
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref Bucket]
          object:
            key: [{prefix: raw/}]
      Targets:
        - Id: ingest
          Arn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
          RoleArn: !GetAtt EventsRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref JobTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            PlatformVersion: LATEST
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                SecurityGroups:
                  - !Ref TaskSecurityGroup
                Subnets: !Split
                  - ","
                  - Fn::ImportValue: !Sub ${PlatformStack}-PublicSubnetIds
          InputTransformer:
            InputPathsMap:
              key: $.detail.object.key
            InputTemplate: '{"containerOverrides":[{"name":"job","command":["python","-m","pipeline","ingest","--key","<key>"]}]}'
          RetryPolicy:
            MaximumRetryAttempts: 5
            MaximumEventAgeInSeconds: 3600

  # Four metrics from the JSON log lines (NFR-05): namespace CICNIDS, dimension Environment
  # taken from each line's env field.
  PageRenderTimeFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.event = "page_render" }'
      MetricTransformations:
        - MetricNamespace: CICNIDS
          MetricName: PageRenderTime
          MetricValue: $.duration_ms
          Unit: Milliseconds
          Dimensions:
            - Key: Environment
              Value: $.env

  IngestionDurationFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.event = "ingestion_run" }'
      MetricTransformations:
        - MetricNamespace: CICNIDS
          MetricName: IngestionDuration
          MetricValue: $.duration_s
          Unit: Seconds
          Dimensions:
            - Key: Environment
              Value: $.env

  RejectedRowsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.event = "ingestion_run" }'
      MetricTransformations:
        - MetricNamespace: CICNIDS
          MetricName: RejectedRows
          MetricValue: $.rows_rejected
          Unit: Count
          Dimensions:
            - Key: Environment
              Value: $.env

  # The closing line of every ingest or reconcile command, so a failure counts once whether or
  # not it got as far as recording a run
  FailedIngestionsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.event = "ingest" || $.event = "reconcile") && $.status = "failed" }'
      MetricTransformations:
        - MetricNamespace: CICNIDS
          MetricName: FailedIngestions
          MetricValue: "1"
          Unit: Count
          Dimensions:
            - Key: Environment
              Value: $.env

  # Alarms email the team through the alerts topic, on ALARM and on recovery (OPS-06). Missing
  # data never breaches, so an environment stopped on purpose stays quiet.
  ServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cicnids-${EnvName}-5xx
      AlarmDescription: !Sub The ${EnvName} app answered with 5xx errors in each of three minutes running.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Select
            - 1
            - !Split
              - loadbalancer/
              - Fn::ImportValue: !Sub ${PlatformStack}-AlbArn
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn
      OKActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cicnids-${EnvName}-cpu
      AlarmDescription: !Sub The ${EnvName} service used more than 80% CPU for five minutes running.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ClusterName
        - Name: ServiceName
          Value: !GetAtt Service.Name
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn
      OKActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn

  MemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cicnids-${EnvName}-memory
      AlarmDescription: !Sub The ${EnvName} service used more than 85% of its memory for five minutes running.
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ClusterName
        - Name: ServiceName
          Value: !GetAtt Service.Name
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn
      OKActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn

  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cicnids-${EnvName}-unhealthy-targets
      AlarmDescription: !Sub A ${EnvName} task failed its health check for three minutes running.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Select
            - 1
            - !Split
              - loadbalancer/
              - Fn::ImportValue: !Sub ${PlatformStack}-AlbArn
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn
      OKActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn

  # One-minute periods, so a failure's email arrives well within five minutes
  FailedIngestionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cicnids-${EnvName}-failed-ingestion
      AlarmDescription: !Sub An ingest or reconcile run failed in ${EnvName}; its log line says why.
      Namespace: CICNIDS
      MetricName: FailedIngestions
      Dimensions:
        - Name: Environment
          Value: !Ref EnvName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn
      OKActions:
        - Fn::ImportValue: !Sub ${PlatformStack}-AlertTopicArn

  # Production's is the demo dashboard. Network comes from Container Insights, which only the
  # production cluster has, so that widget stays empty elsewhere.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub cicnids-${EnvName}
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "Requests", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Sum",
                "metrics": [["AWS/ApplicationELB", "RequestCount", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancerName}", {"label": "Requests"}]]}},
              {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "Latency", "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [["AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancerName}", {"stat": "p50", "label": "p50 (s)"}],
                            ["...", {"stat": "p95", "label": "p95 (s)"}]]}},
              {"type": "metric", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "Errors", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Sum",
                "metrics": [["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancerName}", {"label": "5xx"}],
                            [".", "HTTPCode_Target_4XX_Count", ".", ".", ".", ".", {"label": "4xx"}]]}},
              {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "CPU and memory", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Average",
                "yAxis": {"left": {"min": 0, "max": 100}},
                "metrics": [["AWS/ECS", "CPUUtilization", "ClusterName", "${ClusterName}", "ServiceName", "${Service.Name}", {"label": "CPU %"}],
                            [".", "MemoryUtilization", ".", ".", ".", ".", {"label": "Memory %"}]]}},
              {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "Network in and out", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Average",
                "metrics": [["ECS/ContainerInsights", "NetworkRxBytes", "ClusterName", "${ClusterName}", "ServiceName", "${Service.Name}", {"label": "In (bytes/s)"}],
                            [".", "NetworkTxBytes", ".", ".", ".", ".", {"label": "Out (bytes/s)"}]]}},
              {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "Targets", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Maximum",
                "metrics": [["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancerName}", {"label": "Healthy"}],
                            [".", "UnHealthyHostCount", ".", ".", ".", ".", {"label": "Unhealthy"}]]}},
              {"type": "metric", "x": 0, "y": 12, "width": 8, "height": 6, "properties": {
                "title": "Page render time", "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [["CICNIDS", "PageRenderTime", "Environment", "${EnvName}", {"stat": "p95", "label": "p95 (ms)"}],
                            ["...", {"stat": "Maximum", "label": "Max (ms)"}]]}},
              {"type": "metric", "x": 8, "y": 12, "width": 8, "height": 6, "properties": {
                "title": "Ingestion", "view": "timeSeries", "region": "${AWS::Region}", "period": 300,
                "metrics": [["CICNIDS", "IngestionDuration", "Environment", "${EnvName}", {"stat": "Maximum", "label": "Longest run (s)"}],
                            [".", "RejectedRows", ".", ".", {"stat": "Sum", "label": "Rejected rows", "yAxis": "right"}]]}},
              {"type": "metric", "x": 16, "y": 12, "width": 8, "height": 6, "properties": {
                "title": "Failed ingestions", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Sum",
                "metrics": [["CICNIDS", "FailedIngestions", "Environment", "${EnvName}", {"label": "Failed"}]]}},
              {"type": "alarm", "x": 0, "y": 18, "width": 24, "height": 3, "properties": {
                "title": "Alarms",
                "alarms": ["${ServerErrorsAlarm.Arn}", "${CpuAlarm.Arn}", "${MemoryAlarm.Arn}", "${UnhealthyTargetsAlarm.Arn}", "${FailedIngestionAlarm.Arn}"]}}
            ]
          }
        - LoadBalancerName: !Select
            - 1
            - !Split
              - loadbalancer/
              - Fn::ImportValue: !Sub ${PlatformStack}-AlbArn

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  ClusterName:
    Value: !Ref ClusterName
  ListenerPort:
    Value: !Ref ListenerPort
  TaskSecurityGroupId:
    Value: !GetAtt TaskSecurityGroup.GroupId
  BucketName:
    Value: !Ref Bucket
  LogGroupName:
    Value: !Ref LogGroup
  JobTaskFamily:
    Value: !Sub cicnids-${EnvName}-job
  AdminTaskFamily:
    Value: !Sub cicnids-${EnvName}-admin
  IngestRuleName:
    Value: !Ref IngestRule
  DashboardName:
    Value: !Ref Dashboard
