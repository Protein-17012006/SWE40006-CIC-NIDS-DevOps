[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cicnids"
version = "0.1.0"
description = "CIC-NIDS dashboard and its ingestion pipeline"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff also formats Python blocks inside Markdown; design docs and plans keep their own layout
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["db: needs PostgreSQL via TEST_ADMIN_DATABASE_URL"]
